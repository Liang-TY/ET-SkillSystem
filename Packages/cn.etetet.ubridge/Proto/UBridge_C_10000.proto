message BridgeVector2 
{
    float X = 1;
    float Y = 2;
}
message BridgeVector3 
{
    float X = 1;
    float Y = 2;
    float Z = 3;
}
message BridgeQuaternion 
{
    float X = 1;
    float Y = 2;
    float Z = 3;
    float W = 4;
}
message BridgeTransformInfo 
{
    BridgeVector3 Position = 1;
    BridgeVector3 RotationEuler = 2;
    BridgeQuaternion Rotation = 3;
    BridgeVector3 LocalScale = 4;
}
message BridgeObjectInfo 
{
    int32 InstanceId = 1;
    string Name = 2;
    string Tag = 3;
    int32 Layer = 4;
    bool ActiveSelf = 5;
    bool ActiveInHierarchy = 6;
    BridgeTransformInfo Transform = 7;
    string Path = 8;
}
message BridgeComponentInfo 
{
    string Type = 1;
    string Data = 2;
    repeated BridgeComponentInfo Children = 3;
}
message BridgeAssetInfo 
{
    string Path = 1;
    string Guid = 2;
    string Name = 3;
    string Type = 4;
}
message BridgeSceneNode 
{
    BridgeObjectInfo Object = 1;
    repeated BridgeSceneNode Children = 2;
}

