syntax = "proto3";

package ET;

message BridgeConsoleLog
{
    string LogType = 1;
    string Message = 2;
    string StackTrace = 3;
    string Time = 4;
}

// ResponseType ConsoleGetLogsResponse
message ConsoleGetLogsRequest // IRequest
{
    int32 RpcId = 90;
    int32 Count = 91;
    string LogType = 92;
}

message ConsoleGetLogsResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    repeated BridgeConsoleLog Logs = 93;
    int32 Count = 94;
    int32 TotalCount = 95;
    string LogType = 96;
}

