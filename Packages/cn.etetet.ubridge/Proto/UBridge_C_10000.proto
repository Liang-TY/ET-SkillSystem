syntax = "proto3";
package ET;

// 单条控制台日志
message BridgeConsoleLog
{
    string LogType = 1;    // Error/Warning/Log/Exception
    string Message = 2;    // 日志正文
    string StackTrace = 3; // 堆栈跟踪
    string Time = 4;       // 时间戳
}

// ResponseType ConsoleGetLogsResponse
message ConsoleGetLogsRequest // IRequest
{
    int32 RpcId = 1;
    int32 Count = 2;       // 要获取的条数，0=全部
    string LogType = 3;    // 类型过滤: Error/Warning/Log/All
}

message ConsoleGetLogsResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    repeated BridgeConsoleLog Logs = 4;
    int32 Count = 5;        // 实际返回条数
    int32 TotalCount = 6;   // 控制台日志总数
    string LogType = 7;     // 实际过滤类型
}

// 截图文件信息
message BridgeScreenshotInfo
{
    string Path = 1;        // 完整文件路径
    string FileName = 2;    // 文件名
    int32 Width = 3;        // 图像宽度
    int32 Height = 4;       // 图像高度
    int64 FileSize = 5;     // 文件大小（字节）
    string MediaType = 6;   // MIME 类型 "image/png" 或 "image/jpeg"
}

// ResponseType ScreenshotCaptureResponse
message ScreenshotCaptureRequest // IRequest
{
    int32 RpcId = 1;
    string Target = 2;       // 截图目标，"game" 或 "gameview"
    string Format = 3;       // 输出格式，"png"、"jpg"、"jpeg"
    int32 Quality = 4;       // JPEG 质量 1-100，默认 85
    bool AllowEditMode = 5;  // 是否允许 EditMode 截图
}

message ScreenshotCaptureResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    bool Captured = 4;                      // 是否成功
    string Target = 5;                      // 实际目标
    BridgeScreenshotInfo Screenshot = 6;     // 截图文件信息
}

// ==================== Ping ====================

// ResponseType PingResponse
message Ping // IRequest
{
    int32 RpcId = 1;
}

message PingResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    int64 Time = 4;                         // 服务端 Unix 时间戳 (ms)
    bool IsCompiling = 5;                   // 正在编译脚本？
    bool IsPlaying = 6;                     // PlayMode 中？
    bool IsPlayingOrWillChangePlaymode = 7; // PlayMode 或正在切换？
    string CodeMode = 8;                    // ET GlobalConfig.CodeMode
    string UnityVersion = 9;               // Unity 版本号
}

// ==================== MenuItemExecute ====================

// ResponseType MenuItemExecuteResponse
message MenuItemExecuteRequest // IRequest
{
    int32 RpcId = 1;
    string MenuPath = 2;    // 菜单路径，如 "File/Save Project"
}

message MenuItemExecuteResponse // IResponse
{
    int32 RpcId = 1;
    int32 Error = 2;
    string Message = 3;
    string MenuPath = 4;    // 回显
    bool Executed = 5;      // 是否执行成功
}