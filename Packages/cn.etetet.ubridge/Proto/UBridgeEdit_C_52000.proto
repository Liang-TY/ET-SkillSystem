syntax = "proto3";

package ET;

// ==================== Editor 控制 ====================

// ResponseType ReloadResponse
message Reload // IRequest
{
    int32 RpcId = 90;
}
message ReloadResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool Reloaded = 93;
}

// ResponseType EditorUndoResponse
message EditorUndoRequest // IRequest
{
    int32 RpcId = 90;
    int32 Count = 91;
}
message EditorUndoResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    int32 Count = 93;
}

// ResponseType EditorRedoResponse
message EditorRedoRequest // IRequest
{
    int32 RpcId = 90;
    int32 Count = 91;
}
message EditorRedoResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    int32 Count = 93;
}

// ResponseType EditorPauseResponse
message EditorPauseRequest // IRequest
{
    int32 RpcId = 90;
    bool Toggle = 91;
    bool Pause = 92;
}
message EditorPauseResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool IsPaused = 93;
}

// ResponseType EditorGetStateResponse
message EditorGetStateRequest // IRequest
{
    int32 RpcId = 90;
}
message EditorGetStateResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool IsPlaying = 93;
    bool IsPaused = 94;
    bool IsCompiling = 95;
    bool IsUpdating = 96;
    string ApplicationPath = 97;
    string ApplicationContentsPath = 98;
    bool EnterPlayModeOptionsEnabled = 99;
    string EnterPlayModeOptions = 100;
}

// ==================== 延迟命令（生命周期） ====================

// ResponseType CompileResponse
message Compile // IRequest
{
    int32 RpcId = 90;
}
message CompileResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    int64 DurationMs = 93;
}

// ResponseType RefreshResponse
message Refresh // IRequest
{
    int32 RpcId = 90;
    bool ForceUpdate = 91;
}
message RefreshResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
}

// ResponseType RegenProjectResponse
message RegenProject // IRequest
{
    int32 RpcId = 90;
}
message RegenProjectResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
}

// ResponseType EnterPlayResponse
message EnterPlay // IRequest
{
    int32 RpcId = 90;
}
message EnterPlayResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool IsPlaying = 93;
}

// ResponseType ExitPlayResponse
message ExitPlay // IRequest
{
    int32 RpcId = 90;
}
message ExitPlayResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool IsPlaying = 93;
}

// ==================== 系统 ====================

// ResponseType HostStateResponse
message HostState // IRequest
{
    int32 RpcId = 90;
}
message HostStateResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool IsCompiling = 93;
    bool IsPlaying = 94;
    bool IsPlayingOrWillChangePlaymode = 95;
    string CodeMode = 96;
    string UnityVersion = 97;
    string AvailableCommands = 98;
}

message BridgeBatchStepResult
{
    string Name = 1;
    string Command = 2;
    int32 Error = 3;
    string Message = 4;
}

// ResponseType BatchExecuteResponse
message BatchExecuteRequest // IRequest
{
    int32 RpcId = 90;
    repeated string Commands = 91;
    bool StopOnError = 92;
}
message BatchExecuteResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    repeated BridgeBatchStepResult Results = 93;
    int32 Count = 94;
    int32 Failed = 95;
    bool Completed = 96;
}

// ==================== Asset 延迟命令 ====================

// ResponseType AssetImportResponse
message AssetImportRequest // IRequest
{
    int32 RpcId = 90;
    string AssetPath = 91;
}
message AssetImportResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    string AssetPath = 93;
}

// ResponseType AssetRefreshResponse
message AssetRefreshRequest // IRequest
{
    int32 RpcId = 90;
    bool ForceUpdate = 91;
}
message AssetRefreshResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool Refreshed = 93;
}

// ==================== 剩余命令 ====================

message BridgeGameViewResolution
{
    int32 Width = 1;
    int32 Height = 2;
    string Label = 3;
    bool IsCurrent = 4;
}

message BridgeTestResult
{
    string Name = 1;
    string FullName = 2;
    bool Passed = 3;
    int32 Error = 4;
    string Message = 5;
    int64 DurationMs = 6;
}

// ResponseType TestEchoResponse
message TestEcho // IRequest
{
    int32 RpcId = 90;
    string Text = 91;
}
message TestEchoResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    string Text = 93;
    int64 HandledAt = 94;
    string Handler = 95;
}

// ResponseType EditorLogResponse
message EditorLogRequest // IRequest
{
    int32 RpcId = 90;
    string Message = 91;
    string LogType = 92;
}
message EditorLogResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    bool Logged = 93;
    string LogType = 94;
    string LoggedMessage = 95;
}

// ResponseType GameViewGetResolutionResponse
message GameViewGetResolutionRequest // IRequest
{
    int32 RpcId = 90;
}
message GameViewGetResolutionResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    BridgeGameViewResolution Resolution = 93;
    int32 SelectedIndex = 94;
    string SizeType = 95;
}

// ResponseType GameViewListResolutionsResponse
message GameViewListResolutionsRequest // IRequest
{
    int32 RpcId = 90;
}
message GameViewListResolutionsResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    repeated BridgeGameViewResolution Resolutions = 93;
    int32 Count = 94;
    int32 CurrentIndex = 95;
}

// ResponseType GameViewSetResolutionResponse
message GameViewSetResolutionRequest // IRequest
{
    int32 RpcId = 90;
    int32 Width = 91;
    int32 Height = 92;
    string Label = 93;
}
message GameViewSetResolutionResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    BridgeGameViewResolution Resolution = 93;
    int32 SelectedIndex = 94;
    bool WasAdded = 95;
    string SizeType = 96;
}

