syntax = "proto3";

package ET;

// ==================== Inspector ====================

message BridgePropertyInfo
{
    string Name = 1;
    string DisplayName = 2;
    string Type = 3;
    string StringValue = 4;
    int32 IntValue = 5;
    float FloatValue = 6;
    bool BoolValue = 7;
    BridgeVector2 Vector2Value = 8;
    BridgeVector3 Vector3Value = 9;
    string ObjectReferencePath = 10;
    string ObjectReferenceType = 11;
    bool IsArray = 12;
    bool IsEditable = 13;
    string PropertyPath = 14;
    bool IsExpanded = 15;
    bool HasChildren = 16;
    int32 Depth = 17;
}

// ResponseType InspectorGetComponentsResponse
message InspectorGetComponentsRequest // IRequest
{
    int32 RpcId = 90;
    string Path = 91;
    int32 InstanceId = 92;
    string AssetPath = 93;
    string ObjectPath = 94;
}
message InspectorGetComponentsResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    string GameObjectName = 93;
    string AssetPath = 94;
    string ObjectPath = 95;
    repeated BridgeComponentInfo Components = 96;
    int32 Count = 97;
}

