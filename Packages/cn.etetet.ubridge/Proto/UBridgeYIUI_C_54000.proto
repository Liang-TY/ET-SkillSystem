syntax = "proto3";

package ET;

// ==================== YIUI Create Panel ====================

// ResponseType YIUICreatePanelResponse
message YIUICreatePanelRequest // IRequest
{
    int32 RpcId = 90;
    string Path = 91;
    string Name = 92;
}
message YIUICreatePanelResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    string PrefabPath = 93;
}

// ResponseType PrefabLoadForEditResponse
message PrefabLoadForEditRequest // IRequest
{
    int32 RpcId = 90;
    string PrefabPath = 91;
}
message PrefabLoadForEditResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    int32 RootInstanceId = 93;
}

// ResponseType PrefabSaveModifiedResponse
message PrefabSaveModifiedRequest // IRequest
{
    int32 RpcId = 90;
    int32 InstanceId = 91;
    string PrefabPath = 92;
}
message PrefabSaveModifiedResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
}

