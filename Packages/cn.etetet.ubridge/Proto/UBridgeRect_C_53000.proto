syntax = "proto3";

package ET;

// ==================== RectTransform ====================

// ResponseType RectGetResponse
message RectGetRequest // IRequest
{
    int32 RpcId = 90;
    int32 InstanceId = 91;
}
message RectGetResponse // IResponse
{
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    float AnchorMinX = 93;
    float AnchorMinY = 94;
    float AnchorMaxX = 95;
    float AnchorMaxY = 96;
    float SizeDeltaX = 97;
    float SizeDeltaY = 98;
    float AnchoredPosX = 99;
    float AnchoredPosY = 100;
    float PivotX = 101;
    float PivotY = 102;
    float LocalRotX = 103;
    float LocalRotY = 104;
    float LocalRotZ = 105;
    float LocalScaleX = 106;
    float LocalScaleY = 107;
    float LocalScaleZ = 108;
}

