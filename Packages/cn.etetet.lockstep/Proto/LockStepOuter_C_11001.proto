syntax = "proto3";
package ET;

// ResponseType G2C_Match
message C2G_Match // ISessionRequest
{
	int32 RpcId = 1;
	/// 地图Id（MapIds；0=空地）
	int32 MapId = 2;
}

message G2C_Match // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

/// 匹配成功，通知客户端切换场景
message Match2G_NotifyMatchSuccess // IMessage
{
	int32 RpcId = 1;
	/// 房间的ActorId
	ActorId ActorId = 2;
	/// 本局地图Id（场景切换时视图层按它懒加载瓦片，早于 Room2C_Start）
	int32 MapId = 3;
}

/// 客户端通知房间切换场景完成
message C2Room_ChangeSceneFinish // IRoomMessage
{
	int64 PlayerId = 1;
}

message LockStepUnitInfo
{
	int64 PlayerId = 1;
	TrueSync.TSVector Position = 2;
	TrueSync.TSQuaternion Rotation = 3;
}

/// 房间通知客户端进入战斗
message Room2C_Start // IMessage
{
	int64 StartTime = 1;
	repeated LockStepUnitInfo UnitInfo = 2;
	/// 本局地图Id（room.Init 按它建怪物+碰撞）
	int32 MapId = 3;
}

message FrameMessage // IMessage
{
	int32 Frame = 1;
	int64 PlayerId = 2;
	LSInput Input = 3;
}

message OneFrameInputs // IMessage
{
	map<int64, LSInput> Inputs = 2;
}

message Room2C_AdjustUpdateTime // IMessage
{
	int32 DiffTime = 1;
}

message C2Room_CheckHash // IRoomMessage
{
	int64 PlayerId = 1;
	int32 Frame = 2;
	int64 Hash = 3;
}

message Room2C_CheckHashFail // IMessage
{
	int32 Frame = 1;
	bytes LSWorldBytes = 2;
}

message G2C_Reconnect // IMessage
{
	int64 StartTime = 1;
	repeated LockStepUnitInfo UnitInfos = 2;
	int32 Frame = 3;
}

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType G2C_EnterMap
message C2G_EnterMap // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_EnterMap // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	/// 自己的UnitId
	int64 MyId = 4;
}

message G2C_Test // ISessionMessage
{
}


// ResponseType M2C_TransferMap
message C2M_TransferMap // ILocationRequest
{
	int32 RpcId = 1;
}

message M2C_TransferMap // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ---------- 城镇系统（03 文档 §2/§5）----------
// 注意：opcode 按消息顺序分配，只能追加在文件末尾，不能在中间插入（11020 起）

// ResponseType T2C_EnterTownConfirm
message C2G_EnterTown // ISessionRequest
{
	int32 RpcId = 1;
}

message T2C_EnterTownConfirm // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	/// 已在城镇的成员（远端角色渲染用，单人 demo 为空）
	repeated TownPlayerInfo Members = 4;
}

/// 城镇成员信息
message TownPlayerInfo
{
	int64 PlayerId = 1;
	TrueSync.TSVector Position = 2;
	int32 CharacterId = 3;
	TrueSync.TSVector Forward = 4;
}

/// 有玩家进城镇（广播其他成员）
message T2C_PlayerEnterTown // IMessage
{
	int64 PlayerId = 1;
	TrueSync.TSVector Position = 2;
	int32 CharacterId = 3;
}

/// 有玩家离开城镇（广播其他成员）
message T2C_PlayerLeaveTown // IMessage
{
	int64 PlayerId = 1;
}

/// 城镇位置上报（客户端→TownScene 纯转发；同步开关默认关，03 文档 §2.2）
message C2T_PositionUpdate // ITownMessage
{
	int64 PlayerId = 1;
	TrueSync.TSVector Position = 2;
	TrueSync.TSVector Forward = 3;
	bool IsMoving = 4;
}

/// 城镇位置转发（TownScene→其他成员）
message T2C_PositionBroadcast // IMessage
{
	int64 PlayerId = 1;
	TrueSync.TSVector Position = 2;
	TrueSync.TSVector Forward = 3;
	bool IsMoving = 4;
}

/// 战斗结束（RoomRoot 广播；纤程等玩家走完才销毁，03 文档 §1.4）
message Room2C_BattleEnd // IMessage
{
}

/// 客户端上报怪物全灭（战斗结束触发）
message C2Room_BattleClear // IRoomMessage
{
	int64 PlayerId = 1;
}