panel:
  name: SettingsPanel
  pkg: Lobby
  layer: Popup

nodes:
  - name: u_ComWindow            # 可拖动窗口容器（拖标题区整体移动）
    type: node
    place: { anchor: center, size: [700, 460] }
    children:
      - name: Title
        type: text
        place: { anchor: top, offset: [0, -40], size: [500, 60] }
        props: { text: 设置, fontSize: 34, raycast: true }   # raycast 开启才能接收拖动命中

      - name: u_ComTextTip
        type: text
        place: { anchor: center, offset: [0, -10], size: [600, 60] }
        props: { text: （功能开发中）, fontSize: 26, color: "#999999FF" }

      - name: u_ComBtnClose
        type: button
        place: { anchor: top_right, offset: [-24, -24], size: [48, 48] }
        props: { text: X }

events:
  - { name: u_EventClose, target: u_ComBtnClose, trigger: Click }
  - { name: u_EventWindowDrag, target: Title, trigger: ClickDown }
