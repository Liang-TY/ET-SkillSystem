panel:
  name: BagPanel
  pkg: Lobby
  layer: Popup

nodes:
  - name: u_ComWindow
    type: node
    place: { anchor: center, size: [1080, 820] }
    children:
      - { name: u_ComImgBg, type: image, place: { anchor: stretch }, props: { color: "#E0E0E0FF" } }
      - name: Title
        type: text
        place: { anchor: top, offset: [0, -40], size: [500, 60] }
        props: { text: 背包, fontSize: 34, raycast: true }

      - name: u_ComGridRoot
        type: node
        place: { anchor: center, offset: [0, -30], size: [1000, 700] }
        layout: { type: grid, cellSize: [110, 110], spacing: 10, padding: [10, 10, 10, 10] }

      - name: u_ComBtnClose
        type: button
        place: { anchor: top_right, offset: [-24, -24], size: [48, 48] }
        props: { text: X }

events:
  - { name: u_EventClose, target: u_ComBtnClose, trigger: Click }
  - { name: u_EventWindowDrag, target: Title, trigger: ClickDown }
