panel:
  name: ShopPanel
  pkg: Lobby
  layer: Popup

nodes:
  - { name: u_ComImgBg, type: image, place: { anchor: stretch }, props: { color: "#E0E0E0FF" } }
  - name: Title
    type: text
    place: { anchor: top, offset: [0, -50], size: [500, 60] }
    props: { text: 商城, fontSize: 34 }

  - name: u_ComTextTip
    type: text
    place: { anchor: center, offset: [0, -10], size: [600, 60] }
    props: { text: （功能开发中）, fontSize: 26, color: "#333333FF" }

  - name: u_ComBtnClose
    type: button
    place: { anchor: top_right, offset: [-24, -24], size: [48, 48] }
    props: { text: X }

events:
  - { name: u_EventClose, target: u_ComBtnClose, trigger: Click }
