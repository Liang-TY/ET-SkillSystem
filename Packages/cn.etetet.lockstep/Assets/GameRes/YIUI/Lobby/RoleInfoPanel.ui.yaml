panel:
  name: RoleInfoPanel
  pkg: Lobby
  layer: Popup

nodes:
  - name: Title
    type: text
    place: { anchor: top, offset: [0, -50], size: [500, 60] }
    props: { text: 角色信息, fontSize: 34 }

  - name: u_ComTextInfo
    type: text
    place: { anchor: center, offset: [0, -10], size: [640, 620] }
    props: { text: （角色数值待接入）, fontSize: 26, alignment: UpperLeft, color: "#DDDDDDFF" }

  - name: u_ComBtnClose
    type: button
    place: { anchor: top_right, offset: [-24, -24], size: [48, 48] }
    props: { text: X }

events:
  - { name: u_EventClose, target: u_ComBtnClose, trigger: Click }
