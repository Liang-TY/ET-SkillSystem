panel:
  name: RoleInfoPanel
  pkg: Lobby
  layer: Popup

nodes:
  - name: u_ComWindow
    type: node
    place: { anchor: center, size: [760, 780] }
    children:
      - { name: u_ComImgBg, type: image, place: { anchor: stretch }, props: { color: "#E0E0E0FF" } }
      - name: Title
        type: text
        place: { anchor: top, offset: [0, -40], size: [500, 60] }
        props: { text: 角色信息, fontSize: 34, raycast: true }

      - name: u_ComTextInfo
        type: text
        place: { anchor: center, offset: [0, -20], size: [640, 620] }
        props: { text: （角色数值待接入）, fontSize: 26, alignment: UpperLeft, color: "#333333FF" }

      - name: u_ComBtnClose
        type: button
        place: { anchor: top_right, offset: [-24, -24], size: [48, 48] }
        props: { text: X }

events:
  - { name: u_EventClose, target: u_ComBtnClose, trigger: Click }
  - { name: u_EventWindowDrag, target: Title, trigger: ClickDown }
